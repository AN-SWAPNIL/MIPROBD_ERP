# Hosted development Auth settings only. This does not start a local Supabase stack.
# Review with config diff and pass the development project ref explicitly before config push.
project_id = "mipro-erp-dev"

[auth]
site_url = "https://mipro-erp-staging.vercel.app"
additional_redirect_urls = ["http://localhost:5178/reset-password", "http://localhost:5173/reset-password", "https://mipro-erp-staging.vercel.app/reset-password"]
enable_signup = false
minimum_password_length = 12

[auth.email]
# Keep the email provider enabled; the top-level flag disables public registration.
enable_signup = true
enable_confirmations = true
